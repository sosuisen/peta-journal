# The rules that hold for every shell (ADR 064).

# The common tests that every shell runs (ADR 089, ADR 090). The core writes the examples of
# each into client/tools/shell-check/common/. Each shell names its test of each in its own rules,
# or the issue that writes it (`pending`), or why it needs none (`excluded`).
#
# - list-changes: D1, the shell applies the changes of a list as the core does (#1208)
# - border-web: D2, the web shell reads and writes the values of its border back as they were
#   (#1209)
# - border-native: D2, a native shell reads and writes the values of its border back as they
#   were (#1209)
# - border-emacs: D2, the Lisp of the Emacs shell reads every kind of line that its Rust sends
#   (#1230). The Rust of the shell writes the examples, as the border is its own (ADR 078). The
#   lines that the Lisp sends have none: the Lisp writes them by hand, from keys that nothing
#   generates, so there is nothing to hold them against
[common.list-changes]
examples = "list-changes.json"

[common.border-web]
examples = "border-web.json"

[common.border-native]
examples = "border-native.json"

[common.border-emacs]
examples = "border-emacs.json"

# S2: the kinds of `Event` that the core sends to itself. No shell sends them, so no shell
# needs to name them. The reasons are of four kinds:
#
# - "answer": the core sends it when the journal server answers a request of the core.
# - "timer": the core sends it when a timer that the core started ends.
# - "step": the core sends it as the next step of another event.
# - "request": the core sends it when the shell answers a request of the core, such as an
#   effect that reads the clock. The shell answers through `resolve`, not with an `Event`.
#
# A kind is here only when the core makes it in its own code, and no shell has a reason to
# make it.
[s2.excluded]
AtlasBoundsRefused = "answer: the server refused the new bounds of a card or a callout"
AtlasChanged = "answer: the server changed the outline of an atlas page"
AtlasLinksSuggested = "timer: the search for the link dialog ended"
AutoSaveFired = "timer: the pause after typing ended"
BacklinksLoaded = "answer: the backlinks of a doc page"
BodySaved = "answer: the server saved a body"
BodyShown = "step: a body goes to the server after it is shown"
CanDemoteLoaded = "answer: whether an index page has no pages under it"
CollapseRefused = "answer: the server refused a collapse"
CollapseSaved = "answer: the server saved a collapse"
ConfigLoaded = "answer: the settings of the server"
DateChecked = "request: the shell read the clock for the core"
DateSeen = "request: the shell read the clock after DateMayHaveChanged"
Demoted = "answer: the server demoted an index page"
EditorClosed = "step: the save that ends an edit is over"
EditorFocused = "answer: the field of the ordered editor took the keyboard"
EditorSwitched = "step: the item left with an arrow key is saved"
HandoverEnded = "step: a handler that kept the blur from ending an edit is done"
HistoryPageFound = "answer: whether the page of a URL in the history is there"
HomeLinkSaved = "answer: the server saved the page of the Home button"
ImageUploadFailed = "answer: the pasted image did not reach the server"
ImageUploaded = "answer: the pasted image is on the server"
IndexPagesFailed = "answer: the pages of a directory could not be read"
IndexPagesLoaded = "answer: the pages of a directory"
IndicesRead = "answer: a page read again for the indices of its items"
JournalFailed = "answer: the journal of a day could not be read"
JournalLoaded = "answer: the journal of a day"
LevelShiftRefused = "answer: the server refused an indent or an outdent"
MarkdownCopied = "request: the shell copied items to the clipboard for the core"
MarkdownDirChosen = "request: the shell chose a folder for the core"
MergeAnswered = "request: the user answered whether a transcluded item may be joined"
MergeFailed = "answer: the server refused a join"
Merged = "answer: the server joined two items"
MoveDone = "step: a move is through on screen"
MoveFailed = "answer: the server refused a move"
MovePageReloaded = "answer: a page read again after a move in a transclusion"
Moved = "answer: the server moved items"
MovedInTransclusion = "answer: the server moved an item that a transclusion shows"
MovedItemShown = "timer: the wait for the day an item moved to ended"
MovedToDay = "answer: the server moved an item to another day"
OlderJournalLoaded = "answer: the journal before a shown one"
OpenPage = "step: a page named in the header or the search opens"
PageDeleted = "answer: the server deleted the shown page"
PageFailed = "answer: a doc page or its items could not be read"
PageItemsLoaded = "answer: the items of a doc page"
PageLoaded = "answer: the doc page that the screen opened"
PagePropertyRefused = "answer: the server refused a property change"
PagePropertySaved = "answer: the server saved a property change"
PageRedirected = "answer: the server knows the page under another path"
PageReplaced = "answer: a page read again"
PasteFailed = "answer: the server refused a paste"
Pasted = "answer: the server did a paste"
PastedPageReloaded = "answer: a page read again after a paste in a transclusion"
PreviousJournalsLoaded = "step: the load of the older journals ended"
PropertyDefinitionAdded = "answer: the server accepted a new key"
PropertyDefinitionRefused = "answer: the server refused a change of the definitions"
PropertyDefinitionsLoaded = "answer: the property definitions"
RecentPagesFailed = "answer: the most recent doc pages could not be read"
RecentPagesLoaded = "answer: the most recent doc pages"
ReloadShownPage = "step: the shown page is read again, such as after a failed undo"
RootParsed = "answer: the server saved the source of a transclusion root"
SearchAnswered = "answer: the result of a search"
SearchFailed = "answer: a search failed"
SelectionDeleted = "answer: the server deleted the selected items"
SplitDone = "answer: the server split an item"
SplitFailed = "answer: the server refused a split"
SplitPageReloaded = "answer: a page read again after a split in a transclusion"
Sse = "request: a message on the event stream that the shell opened for the core"
SseReconnect = "timer: the wait before connecting the event stream again ended"
StashFailed = "answer: the stash did not reach the server"
Stashed = "answer: the server sent an item to the stash"
TagsDirSaved = "answer: the server saved the tag directory"
TaskCycleFailed = "answer: the server refused a change of the task state"
TaskCycled = "answer: the server changed the task state"
TitleSaved = "answer: the server saved a new title"
TransclusionChanged = "answer: the server made an item a transclusion or a plain item"
UndoSynced = "answer: the server wrote what an undo or a redo replayed"
WikiLinksSuggested = "timer: the search for a wiki link ended"
