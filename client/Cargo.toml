[workspace]
resolver = "2"
members = [
    "libs/client-core",
    "libs/client-page-links",
    "libs/client-api-http",
    "libs/client-api-embedded",
    "apps/emacs/outliner",
    "libs/client-native-bridge",
    # The core for the web shell in TypeScript (ADR 079)
    "libs/client-web-bridge",
    "libs/client-shell-http",
    "libs/client-shell-embedded",
    "libs/client-cloud-sync",
    "libs/client-stickies",
    "tools/app-icon",
    "tools/shell-check",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The crates of flatmarkdown, all of one release (ADR 020). Keep the three versions the same,
# and the same as `flatmarkdown` of journal/journal-core.
flatmarkdown = "=0.10.0"
flatmarkdown-ast = "=0.10.0"
flatmarkdown-ast2html = "=0.10.0"

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"

# Less debug info makes the debug build link faster, which every test run waits for. Our crates
# keep the line tables, so a panic still names the file and line. The dependencies keep none, as
# we do not step into them.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
