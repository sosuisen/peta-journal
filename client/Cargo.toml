[workspace]
resolver = "2"
members = [
    "libs/client-core",
    "libs/client-page-links",
    "libs/client-api-http",
    "libs/client-api-embedded",
    "apps/web-app/outliner",
    "apps/emacs/outliner",
    "libs/client-native-bridge",
    "libs/client-shell-http",
    "libs/client-shell-embedded",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The same version as `flatmarkdown` of journal/journal-core and as `flatmarkdown-ast2html`:
# a release has all three crates (ADR 020).
flatmarkdown-ast = "=0.7.0"

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"

# Less debug info makes the debug build link faster, which every test run waits for. Our crates
# keep the line tables, so a panic still names the file and line. The dependencies keep none, as
# we do not step into them.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
