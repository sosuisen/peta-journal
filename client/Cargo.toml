[workspace]
resolver = "2"
members = [
    "libs/client-core",
    "libs/client-page-links",
    "libs/client-api-http",
    "libs/client-api-embedded",
    "apps/web-app/outliner",
    "apps/emacs/outliner",
    "libs/client-native-bridge",
    "libs/client-shell-http",
    "libs/client-shell-embedded",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The crates of flatmarkdown, all of one release (ADR 020). Until the typed AST of ADR 041 is
# published, they come from the clone of flatmarkdown beside this repository.
flatmarkdown = { path = "../../flatmarkdown/flatmarkdown" }
flatmarkdown-ast = { path = "../../flatmarkdown/flatmarkdown-ast" }
flatmarkdown-ast2html = { path = "../../flatmarkdown/flatmarkdown-ast2html" }

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"

# Less debug info makes the debug build link faster, which every test run waits for. Our crates
# keep the line tables, so a panic still names the file and line. The dependencies keep none, as
# we do not step into them.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
