[package]
name = "client-shell-embedded"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "PetaJournal native frontends: the Crux core with a journal core inside the app, for the Android and iOS shells (ADR 029, ADR 034)"

[lib]
crate-type = ["lib", "staticlib", "cdylib"]

[dependencies]
client-core = { path = "../client-core" }
client-native-bridge = { path = "../client-native-bridge" }
client-api-embedded = { path = "../client-api-embedded" }
# The sync with Dropbox (ADR 054)
client-cloud-sync = { path = "../client-cloud-sync" }
journal-core = { path = "../../../journal/journal-core", default-features = false }
boltffi = "=0.32.1"
# Reads back the address of a file that the core orders to open (ADR 083)
percent-encoding = "2.3.2"

[dev-dependencies]
# The whole view model, for the tests to look for words in it (ADR 076)
client-native-bridge = { path = "../client-native-bridge", features = ["test-support"] }
tempfile = "3"
# The date of today, to name the journal a test expects
chrono = "0.4.45"
# Writes an event as the Kotlin shell does
crux_core = "=0.20.0"
serde_json = { workspace = true }
