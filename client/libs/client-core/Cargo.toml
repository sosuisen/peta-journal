[package]
name = "client-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "PetaJournal frontend core (Crux): outline state, item operations, undo, effects"

[lib]
name = "client_core"

[dependencies]
crux_core = "=0.20.0"
# `rc` writes the shared items of the view model (`Arc<Item>`)
serde = { workspace = true, features = ["rc"] }
serde_json = { workspace = true }
flatmarkdown-ast = { workspace = true }
# The core makes the AST of each body that it shows (ADR 041)
flatmarkdown = { workspace = true }
hmtid = { path = "../../../journal/hmtid" }
# The names of the journals and the numbers of the weeks, as the journal has them
journal-names = { path = "../../../journal/journal-names" }
# The names a page may take, as the journal checks them
page-names = { path = "../../../journal/page-names" }
# The URLs of the pages, as the journal makes them (ADR 061)
page-urls = { path = "../../../journal/page-urls" }
# The address of a file of the assets folder, as a copy and a native shell write it (ADR 083)
client-page-links = { path = "../client-page-links" }
# The bodies of the requests, in the types the journal reads them with
journal-api-types = { path = "../../../journal/journal-api-types" }
# Makes the name of a new key from its body and type (ADR 047)
property-names = { path = "../../../journal/property-names" }
getrandom = { version = "0.3", features = ["wasm_js"] }
futures = "0.3"
percent-encoding = "2.3.2"
# Keeps a place that the core finds itself out of the middle of an emoji (ADR 043)
unicode-segmentation = "1.13.3"
peta-atlas = { path = "../../../atlas", features = ["marks", "api-types"] }
# rand of picturesque-marks, under peta-atlas, pulls in getrandom 0.4, which needs a backend on wasm
getrandom-04 = { package = "getrandom", version = "0.4", features = ["wasm_js"] }
uuid = { version = "1.29.2", features = ["v4", "js"] }
# Describes the types that cross the native border (ADR 024). Only the generation of the types
# of the shells turns it on
facet = { version = "=0.46.5", optional = true }
# Reads the types of the border as the generators of the shells do, to make the examples of D2
# (ADR 090). Only the tests of the bridges turn it on, so no app is built with it
facet_generate = { version = "=0.22.3", optional = true }

[dev-dependencies]
# The lists of the property test of the list changes
proptest = "1.12.0"

[features]
facet_typegen = ["dep:facet", "peta-atlas/facet", "flatmarkdown-ast/facet", "journal-api-types/facet"]
# The sample values of the types of the border, for the examples of D2 (ADR 090,
# changes/samples.rs)
border_examples = ["facet_typegen", "dep:facet_generate"]
