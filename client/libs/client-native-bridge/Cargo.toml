[package]
name = "client-native-bridge"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "PetaJournal native frontends: the Crux core behind a border of bytes, under the shells that are not written in Rust (ADR 024, ADR 036)"

# No app links with this crate. The crates with an entrance for another language do:
# `client-shell-http` and `client-shell-embedded` (ADR 036)

[dependencies]
client-core = { path = "../client-core" }
crux_core = "=0.20.0"
serde = { workspace = true }
# The links to pages that another app opens, and the HTML of a copy (ADR 027)
client-page-links = { path = "../client-page-links" }
chrono = "0.4.45"
facet = { version = "=0.46.5", optional = true }
# Writes the C# types. Crux 0.20.0 brings 0.19 of this generator, whose C# does not compile
# for the types of the border (ADR 028)
facet_generate = { version = "=0.22.3", optional = true }

[dev-dependencies]
# The parser, to make the AST of a test from Markdown
flatmarkdown = { workspace = true }
# The files of the images a test pastes
tempfile = "3"
# The examples that the shells run, which are JSON (src/examples.rs)
serde_json = { workspace = true }
# The samples of the types of the border, read as the types to write their bytes, for the
# examples of D2 (ADR 090, tests/border_examples.rs)
client-core = { path = "../client-core", features = ["border_examples"] }
facet-json = "=0.46.1"

[features]
# The whole view model of `NativeShell::view`, for the tests of the crates with an entrance.
# They turn it on in their `[dev-dependencies]`, so no app is built with it: a shell reads
# only `changes()` (ADR 076)
test-support = []
# Describes the types that cross the border, to generate the types of the shells from them.
# `#[effect(facet_typegen)]` asks for this name
facet_typegen = [
    "dep:facet",
    "dep:facet_generate",
    "crux_core/facet_typegen",
    "client-core/facet_typegen",
]

# Writes the types of the border for a shell: `cargo run -p client-native-bridge --features
# facet_typegen --bin codegen -- swift <folder>`
[[bin]]
name = "codegen"
required-features = ["facet_typegen"]
