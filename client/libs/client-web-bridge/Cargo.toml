[package]
name = "client-web-bridge"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The core for the web shell in TypeScript: events in, changes out, as the JSON of facet (ADR 079, ADR 080)"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# The facet derives write the border as JSON, as for Emacs (ADR 078, ADR 080)
client-core = { path = "../client-core", features = ["facet_typegen"] }
facet = "=0.46.5"
facet-json = "=0.46.1"
client-page-links = { path = "../client-page-links" }
crux_core = "=0.20.0"
serde = { workspace = true }
# What the browser keeps in its local storage, as the web app in Leptos wrote it
serde_json = { workspace = true }
# The URLs of the pages, as the journal makes them (ADR 061)
page-urls = { path = "../../../journal/page-urls" }
# The cards and the callouts of an atlas, as atlas.js reads them
peta-atlas = { path = "../../../atlas", features = ["marks"] }
flatmarkdown-ast = { workspace = true }
flatmarkdown-ast2html = { workspace = true }

# The browser behind the core (src/web.rs)
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
gloo-net = { version = "0.6", features = ["http"] }
gloo-timers = "0.3"
console_error_panic_hook = "0.1"
web-sys = { version = "0.3", features = [
  "Window", "Document", "Location", "History", "Storage", "Navigator", "Clipboard",
  "ClipboardItem", "Blob", "BlobPropertyBag", "File", "FormData", "Event", "MessageEvent",
  "EventSource", "console",
] }

# Writes the TypeScript types of the border. Not in wasm: only the codegen runs it
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
facet_generate = "=0.22.3"

[dev-dependencies]
# The samples of the types of the border, for the examples of D2 (ADR 090, src/examples.rs)
client-core = { path = "../client-core", features = ["border_examples"] }
