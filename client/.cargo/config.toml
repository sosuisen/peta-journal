# hmtid uses rand, whose getrandom needs the JavaScript backend on wasm32.
[target.wasm32-unknown-unknown]
rustflags = ['--cfg', 'getrandom_backend="wasm_js"']

# `cargo cov` measures the test coverage of the crates that run natively with cargo-llvm-cov. It
# prints a table per file; `cargo cov --html` writes a browsable report to target/llvm-cov/html/.
# Setup, once: `rustup component add llvm-tools-preview` and
# `cargo install cargo-llvm-cov --locked`.
#
# The numbers are not a target: the report is read for the lines no test reaches, which are
# either removed or given a test of the behaviour that needs them.
#
# The browser side of `client-web-bridge` (src/web.rs) is built for wasm only, so a native build
# leaves it out and it is not measured. cargo-mutants skips it too; see .cargo/mutants.toml.
#
# No file of `outliner-emacs` is left out, as agreed on 2026-11-10. Its tests in
# apps/emacs/outliner/tests/process.rs run the program itself, and that run is measured too. For
# this the program ends by returning from `main`: a killed program writes no coverage.
[alias]
cov = [
    "llvm-cov",
    "-p",
    "client-core",
    "-p",
    "client-page-links",
    "-p",
    "client-api-http",
    "-p",
    "client-api-embedded",
    "-p",
    "outliner-emacs",
    "-p",
    "client-native-bridge",
    "-p",
    "client-shell-http",
    "-p",
    "client-shell-embedded",
    "-p",
    "client-cloud-sync",
    "-p",
    "client-stickies",
    "-p",
    "client-web-bridge",
    # What only a native shell needs is measured too: the generation of its types, and the
    # entrance for another language
    "--features",
    "client-native-bridge/facet_typegen,client-shell-http/ffi",
]

# rust-lld links much faster than the MSVC link.exe, and it comes with the Rust toolchain. Every
# test run waits for the link of the test binaries. The wasm target already links with it.
[target.x86_64-pc-windows-msvc]
linker = "rust-lld.exe"
