# hmtid uses rand, whose getrandom needs the JavaScript backend on wasm32.
[target.wasm32-unknown-unknown]
rustflags = ['--cfg', 'getrandom_backend="wasm_js"']

# `cargo cov` measures the test coverage of every crate of the workspace with cargo-llvm-cov. It
# prints a table per file; `cargo cov --html` writes a browsable report to target/llvm-cov/html/.
# Setup, once: `rustup component add llvm-tools-preview` and
# `cargo install cargo-llvm-cov --locked`.
#
# Below 90% of the lines, `cargo cov` fails, and so does the CI. The lines are counted over all
# the measured crates together, not file by file. The report is read for the lines no test
# reaches. They are either removed or given a test of the behaviour that needs them. A test only
# to reach a line is not written.
#
# scripts/verification.test.mjs fails when a crate of the workspace is not measured, or when the
# floor or the files left out change. Such a change needs the consent of the developer.
#
# Why `--no-rustc-wrapper`: by default, cargo-llvm-cov 0.9 builds through a rustc wrapper of its
# own. The wrapper instruments only the crates of the workspace. On Windows, it left
# client-api-embedded and client-shell-embedded without instrumentation (2026-11-25). Both use
# journal-core. Their tests ran, but no line of them was counted. The cause is not known. Without
# the wrapper, every crate is instrumented, the dependencies too, so the first build takes longer.
#
# The crates of ../journal and ../atlas are outside this workspace. Without the wrapper, their
# files show up in the table too. Their own workspaces measure them, so the regex below leaves
# them out.
#
# The browser side of `client-web-bridge` (src/web.rs) is built for wasm only, so a native build
# leaves it out and it is not measured. cargo-mutants skips it too; see .cargo/mutants.toml.
#
# No file of `outliner-emacs` is left out, as agreed on 2026-11-10. Its tests in
# apps/emacs/outliner/tests/process.rs run the program itself, and that run is measured too. For
# this the program ends by returning from `main`: a killed program writes no coverage.
[alias]
cov = [
    "llvm-cov",
    "--no-rustc-wrapper",
    "-p",
    "client-core",
    "-p",
    "client-page-links",
    "-p",
    "client-api-http",
    "-p",
    "client-api-embedded",
    "-p",
    "outliner-emacs",
    "-p",
    "client-native-bridge",
    "-p",
    "client-shell-http",
    "-p",
    "client-shell-embedded",
    "-p",
    "client-cloud-sync",
    "-p",
    "client-stickies",
    "-p",
    "client-web-bridge",
    "-p",
    "shell-check",
    "-p",
    "app-icon",
    # What only a native shell needs is measured too: the generation of its types, and the
    # entrance for another language
    "--features",
    "client-native-bridge/facet_typegen,client-shell-http/ffi",
    # `[/\\]`: the paths have backslashes on Windows
    "--ignore-filename-regex",
    "[/\\\\](journal|atlas)[/\\\\]",
    "--fail-under-lines",
    "90",
]

# rust-lld links much faster than the MSVC link.exe, and it comes with the Rust toolchain. Every
# test run waits for the link of the test binaries. The wasm target already links with it.
[target.x86_64-pc-windows-msvc]
linker = "rust-lld.exe"
