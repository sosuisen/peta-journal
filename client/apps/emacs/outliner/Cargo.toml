[package]
name = "outliner-emacs"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "PetaJournal Emacs frontend: a shell process for the Crux core, driven by peta-journal.el"

[[bin]]
name = "outliner-emacs"
path = "src/main.rs"

[dependencies]
# The list diff of the rows, with the facet derives that write it as JSON (ADR 078)
client-core = { path = "../../../libs/client-core", features = ["facet_typegen"] }
# The URLs of the pages, as the journal makes them (ADR 061)
page-urls = { path = "../../../../journal/page-urls" }
crux_core = "=0.20.0"
# Describes the lines of Emacs, and reads and writes them as JSON (ADR 078)
facet = "=0.46.5"
facet-json = "0.46.1"
client-api-http = { path = "../../../libs/client-api-http" }
chrono = "0.4.45"
# The AST of a body, from which EmacsText is made, and the bound that BodyModel asks for
flatmarkdown-ast = { workspace = true }
serde = { workspace = true }
# How wide Emacs shows a letter, to line up the cells of a table
unicode-width = "0.2.3"

[dev-dependencies]
# The answers of the server in the tests, and the lines read back as JSON
serde_json = { workspace = true }
# The registry of the types, to write the Lisp of the protocol (ADR 078)
facet_generate = "=0.22.3"
# Bodies of every kind, to check that EmacsText counts the shown letters as RichText does
proptest = "1.12.0"
# The samples of the lines to Emacs, for the examples of its border (ADR 090)
client-core = { path = "../../../libs/client-core", features = ["facet_typegen", "border_examples"] }
