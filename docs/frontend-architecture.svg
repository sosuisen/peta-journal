<svg xmlns="http://www.w3.org/2000/svg" width="680" height="530" viewBox="0 0 680 530" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>PetaJournal browser frontend and Emacs frontend</title>
<desc>A local server runs journal-server (Rust, axum). The browser frontend is WASM with shell-leptos (Rust, Leptos) and peta-core (Rust, Crux), talking to it with fetch and EventSource. The Emacs frontend is a Rust process with shell-emacs (Rust) and the same peta-core, using ureq, plus peta-journal.el (Emacs Lisp) connected by JSON lines over stdin and stdout.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
<style>
text { font-family: "Hiragino Sans", "Yu Gothic UI", "Meiryo", "Noto Sans JP", sans-serif; font-size: 14px; fill: #1F1E1D; }
.th { font-weight: 500; }
.arr { stroke: #5F5E5A; stroke-width: 1.5; fill: none; }
.frame { fill: none; stroke: #5F5E5A; stroke-width: 1.5; }
.inner { fill: none; stroke: #888780; stroke-width: 1; stroke-dasharray: 5 4; }
.teal rect { fill: #E1F5EE; stroke: #0F6E56; stroke-width: 1; }
.teal text { fill: #085041; }
.purple rect { fill: #EEEDFE; stroke: #534AB7; stroke-width: 1; }
.purple text { fill: #3C3489; }
.coral rect { fill: #FAECE7; stroke: #993C1D; stroke-width: 1; }
.coral text { fill: #712B13; }
</style>
</defs>
<rect x="0" y="0" width="680" height="530" fill="#FFFFFF"/>

<rect class="frame" x="180" y="14" width="320" height="104" rx="14"/>
<text class="th" x="196" y="36">ローカルサーバ</text>
<g class="coral">
<rect x="200" y="50" width="280" height="56" rx="8"/>
<text class="th" x="340" y="67" text-anchor="middle" dominant-baseline="central">journal-server（Rust, axum）</text>
<text x="340" y="89" text-anchor="middle" dominant-baseline="central">REST・SSE /api/events</text>
</g>

<rect class="frame" x="20" y="150" width="300" height="266" rx="14"/>
<text class="th" x="36" y="172">ブラウザ フロントエンド</text>
<rect class="inner" x="36" y="186" width="268" height="214" rx="10"/>
<text x="52" y="204">WASM</text>

<rect class="frame" x="360" y="150" width="300" height="372" rx="14"/>
<text class="th" x="376" y="172">Emacs フロントエンド</text>
<rect class="inner" x="376" y="186" width="268" height="214" rx="10"/>
<text x="392" y="204">Rust プロセス（exe）</text>

<line class="arr" x1="260" y1="216" x2="260" y2="110" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
<text x="252" y="134" text-anchor="end" dominant-baseline="central">fetch・EventSource</text>
<path class="arr" d="M580 216 L580 78 L484 78" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
<text x="588" y="134" dominant-baseline="central">ureq</text>

<g class="teal">
<rect x="52" y="218" width="236" height="56" rx="8"/>
<text class="th" x="170" y="235" text-anchor="middle" dominant-baseline="central">shell-leptos（Rust, Leptos）</text>
<text x="170" y="257" text-anchor="middle" dominant-baseline="central">DOM 描画・Effect 実行</text>
</g>
<g class="teal">
<rect x="392" y="218" width="206" height="56" rx="8"/>
<text class="th" x="495" y="235" text-anchor="middle" dominant-baseline="central">shell-emacs（Rust）</text>
<text x="495" y="257" text-anchor="middle" dominant-baseline="central">差分送信・Effect 実行</text>
</g>

<line class="arr" x1="90" y1="276" x2="90" y2="318" marker-end="url(#arrow)"/>
<text x="98" y="298" dominant-baseline="central">Event</text>
<line class="arr" x1="260" y1="320" x2="260" y2="278" marker-end="url(#arrow)"/>
<text x="252" y="298" text-anchor="end" dominant-baseline="central">Effect・VM</text>
<line class="arr" x1="420" y1="276" x2="420" y2="318" marker-end="url(#arrow)"/>
<text x="428" y="298" dominant-baseline="central">Event</text>
<line class="arr" x1="570" y1="320" x2="570" y2="278" marker-end="url(#arrow)"/>
<text x="562" y="298" text-anchor="end" dominant-baseline="central">Effect・VM</text>

<g class="purple">
<rect x="52" y="322" width="236" height="56" rx="8"/>
<text class="th" x="170" y="339" text-anchor="middle" dominant-baseline="central">peta-core（Rust, Crux）</text>
<text x="170" y="361" text-anchor="middle" dominant-baseline="central">共通・update/view・REST</text>
</g>
<g class="purple">
<rect x="392" y="322" width="206" height="56" rx="8"/>
<text class="th" x="495" y="339" text-anchor="middle" dominant-baseline="central">peta-core（Rust, Crux）</text>
<text x="495" y="361" text-anchor="middle" dominant-baseline="central">共通・update/view・REST</text>
</g>
<line x1="290" y1="350" x2="390" y2="350" stroke="#5F5E5A" stroke-width="1" stroke-dasharray="4 3"/>

<g class="teal">
<rect x="392" y="450" width="252" height="56" rx="8"/>
<text class="th" x="518" y="467" text-anchor="middle" dominant-baseline="central">peta-journal.el（Emacs Lisp）</text>
<text x="518" y="489" text-anchor="middle" dominant-baseline="central">行を描画・操作を報告</text>
</g>
<path class="arr" d="M620 448 L620 246 L602 246" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
<text x="612" y="425" text-anchor="end" dominant-baseline="central">JSON lines（stdin/stdout）</text>
</svg>
