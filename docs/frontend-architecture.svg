<svg xmlns="http://www.w3.org/2000/svg" width="1330" height="1108" viewBox="0 0 1330 1108" role="img">
<title>PetaJournal frontends: browser, SwiftUI, WinUI3, Emacs, todo and stickies</title>
<desc>Three frontends share one core, and a fourth is planned. The browser frontend is one WASM binary with shell-leptos (Rust, Leptos), fm-leptos and peta-core (Rust, Crux), and talks to the server with fetch and EventSource. The SwiftUI frontend, in development, is frontend-swiftui (SwiftUI), connected by bincode over BoltFFI to a Rust library with shell-native, peta-core and server-client (Rust, ureq). The WinUI3 frontend is planned. It will use the same Rust library with shell-native. The Emacs frontend is peta-journal.el (Emacs Lisp), connected by JSON lines over stdin and stdout to a Rust process with shell-emacs, peta-core and server-client. Two more frontends do not use the core. The todo frontend (TypeScript, React) talks to the server with fetch and EventSource, and renders the AST with flatmarkdown-ast2react, a TypeScript package. The stickies frontend (C#, WinUI3) talks to the server with HttpClient, and renders the AST with flatmarkdown-ast2html. The local server is journal-server (Rust, axum) with REST and SSE at /api/events. It also serves MCP at /mcp. The server keeps its pages in a SQLite database. It syncs the pages with .md files in a local folder, in both directions. An AI agent talks to it as an MCP client over Streamable HTTP.</desc>
