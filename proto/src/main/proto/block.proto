syntax = "proto3";

package petajournal;

option java_package = "com.petajournal.proto";
option java_outer_classname = "BlockProto";
option java_multiple_files = true;

import "common.proto";

message Block {
  string id = 1;                    // UUID
  string page_id = 2;              // UUID of parent page
  string dir_path = 3;             // Sub-path within type dir
  string name = 4;                 // Name of the page
  string type = 15;                // "journal" or "doc" (from parent page)
  Timestamp created_date = 5;
  Timestamp modified_date = 6;
  string idx = 7;                   // Fractional index string for ordering
  int32 level = 8;                  // Indentation level (1-based, 1=top level)
  string body = 9;                  // Markdown source text
  string html = 10;                 // Parsed HTML
  bool collapsed = 11;              // Whether children are collapsed
  string status = 12;              // Block status: normal, todo, running, done
  repeated string types = 13;      // Block types (e.g. "heading", "code")
}
