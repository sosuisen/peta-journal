syntax = "proto3";

package petajournal;

option java_package = "com.petajournal.proto";
option java_outer_classname = "SearchProto";
option java_multiple_files = true;

message SearchRequest {
  string query = 1;
  int32 max_results = 2;           // 0 means default (20)
}

message SearchResponse {
  repeated SearchResult results = 1;
  int32 total_hits = 2;
}

message SearchResult {
  string page_id = 1;
  string page_title = 2;
  string block_id = 3;             // Empty for page-name-only results
  string snippet = 4;              // Highlighted snippet
  float score = 5;
}
