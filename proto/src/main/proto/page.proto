syntax = "proto3";

package petajournal;

option java_package = "com.petajournal.proto";
option java_outer_classname = "PageProto";
option java_multiple_files = true;

import "common.proto";

message Page {
  string id = 1;                    // UUID
  string dir_path = 2;             // e.g. "journals/2025/01"
  string file_name = 3;            // e.g. "2025-01-15" or "my-page"
  Timestamp created_date = 4;
  Timestamp modified_date = 5;
  repeated string tags = 6;
  repeated PageTitle titles = 7;
  string properties_json = 8;      // Extensible JSON properties
}

message PageTitle {
  string page_id = 1;
  int32 order_index = 2;
  string title = 3;
}
