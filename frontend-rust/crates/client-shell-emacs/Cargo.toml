[package]
name = "client-shell-emacs"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "PetaJournal Emacs frontend: a shell process for the Crux core, driven by peta-journal.el"

[[bin]]
name = "client-shell-emacs"
path = "src/main.rs"

[dependencies]
peta-core = { path = "../core" }
crux_core = "=0.20.0"
serde = { workspace = true }
serde_json = { workspace = true }
client-api-http = { path = "../client-api-http" }
chrono = "0.4.45"
