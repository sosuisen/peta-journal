[package]
name = "peta-shell-native"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "PetaJournal native frontends: the Crux core behind a border of bytes, for the SwiftUI and WinUI shells (ADR 024)"

# What a native shell links with: the SwiftUI shell with the static library, and the WinUI shell
# with the dynamic one (BoltFFI packs no other for C#)
[lib]
crate-type = ["lib", "staticlib", "cdylib"]

[dependencies]
peta-core = { path = "../core" }
peta-server-client = { path = "../server-client" }
crux_core = "=0.20.0"
serde = { workspace = true }
# The HTML of an item (ADR 025). The same version as `flatmarkdown-ast`: a release has all the
# crates of flatmarkdown (ADR 020)
flatmarkdown-ast = { workspace = true }
flatmarkdown-ast2html = "=0.7.0"
# The links to pages that another app opens, and the HTML of a copy (ADR 027)
peta-page-links = { path = "../page-links" }
chrono = "0.4.45"
facet = { version = "=0.46.5", optional = true }
# Writes the C# types. Crux 0.20.0 brings 0.19 of this generator, whose C# does not compile
# for the types of the border (ADR 028)
facet_generate = { version = "=0.22.3", optional = true }
boltffi = { version = "=0.32.1", optional = true }

[dev-dependencies]
# The parser, to make the AST of a test from Markdown. The same version as the other two crates
# of a release (ADR 020)
flatmarkdown = "=0.7.0"

[features]
# The entrance for a shell in another language, made with BoltFFI. `boltffi pack` turns it on
ffi = ["dep:boltffi"]
# Describes the types that cross the border, to generate the types of the shells from them.
# `#[effect(facet_typegen)]` asks for this name
facet_typegen = [
    "dep:facet",
    "dep:facet_generate",
    "crux_core/facet_typegen",
    "peta-core/facet_typegen",
]

# Writes the Swift types of the border: `cargo run -p peta-shell-native --features facet_typegen
# --bin codegen -- <folder>`
[[bin]]
name = "codegen"
required-features = ["facet_typegen"]
