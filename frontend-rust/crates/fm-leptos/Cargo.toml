[package]
name = "fm-leptos"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Leptos renderer for the Flat Markdown AST, matching flatmarkdown-ast2angular"

[dependencies]
flatmarkdown-ast = { workspace = true }
leptos = { version = "0.8", features = ["csr"] }
serde_json = { workspace = true }

[dev-dependencies]
# `ssr` adds `to_html()` so the host tests can compare rendered HTML strings.
leptos = { version = "0.8", features = ["csr", "ssr"] }
flatmarkdown = "=0.6.0"
