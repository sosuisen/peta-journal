[build]
target = "index.html"
dist = "dist"

# No [serve] and no proxy: the journal server serves the built files (ADR 010). `trunk serve`
# is not used, and its page could not reach the API.

# Windows ARM64 only: install wasm-bindgen-cli matching Cargo.lock, since Trunk has no
# prebuilt wasm-bindgen for that platform. No-op elsewhere (see scripts/sync-wasm-bindgen.ps1).
[[hooks]]
stage = "pre_build"
command = "true"
command_arguments = []

[hooks.windows]
command = "pwsh"
command_arguments = ["-NoProfile", "-File", "scripts/sync-wasm-bindgen.ps1"]
