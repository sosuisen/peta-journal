[build]
target = "index.html"
dist = "dist"

[serve]
port = 4200

# The journal server. For the end-to-end tests see Trunk.e2e.toml.
[[proxy]]
backend = "http://localhost:8087/api/"

[[proxy]]
backend = "http://localhost:8087/assets/"

# Windows ARM64 only: install wasm-bindgen-cli matching Cargo.lock, since Trunk has no
# prebuilt wasm-bindgen for that platform. No-op elsewhere (see scripts/sync-wasm-bindgen.ps1).
[[hooks]]
stage = "pre_build"
command = "true"
command_arguments = []

[hooks.windows]
command = "pwsh"
command_arguments = ["-NoProfile", "-File", "scripts/sync-wasm-bindgen.ps1"]
