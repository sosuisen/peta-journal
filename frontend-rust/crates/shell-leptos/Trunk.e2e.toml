# `trunk serve --config Trunk.e2e.toml`: the dev server in front of the journal server the
# end-to-end tests start on port 8187 (see frontend/playwright.config.ts).
[build]
target = "index.html"
dist = "dist-e2e"

[serve]
port = 4300
open = false

[[proxy]]
backend = "http://localhost:8187/api/"

[[proxy]]
backend = "http://localhost:8187/assets/"

# Windows ARM64 only: install wasm-bindgen-cli matching Cargo.lock, since Trunk has no
# prebuilt wasm-bindgen for that platform. No-op elsewhere (see scripts/sync-wasm-bindgen.ps1).
[[hooks]]
stage = "pre_build"
command = "true"
command_arguments = []

[hooks.windows]
command = "pwsh"
command_arguments = ["-NoProfile", "-File", "scripts/sync-wasm-bindgen.ps1"]
