# `trunk serve --config Trunk.e2e.toml`: the dev server in front of the journal server the
# end-to-end tests start on port 8187 (see frontend/playwright.config.ts).
[build]
target = "index.html"
dist = "dist-e2e"

[serve]
port = 4300
open = false

[[proxy]]
backend = "http://localhost:8187/api/"

[[proxy]]
backend = "http://localhost:8187/assets/"
