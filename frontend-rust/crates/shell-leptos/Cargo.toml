[package]
name = "peta-frontend"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "PetaJournal web frontend: Leptos shell for the Crux core"

[[bin]]
name = "peta-frontend"
path = "src/main.rs"

[dependencies]
peta-core = { path = "../core" }
peta-atlas = { path = "../../../atlas-rust", features = ["marks"] }
fm-ast = { path = "../fm-ast" }
fm-leptos = { path = "../fm-leptos" }
flatmarkdown = "0.4.3"
crux_core = "=0.20.0"
leptos = { version = "0.8", features = ["csr"] }
leptos_router = { version = "0.8" }
serde = { workspace = true }
serde_json = { workspace = true }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
gloo-net = { version = "0.6", features = ["http", "eventsource"] }
gloo-timers = { version = "0.3", features = ["futures"] }
console_error_panic_hook = "0.1"
gloo-events = "0.2"
serde-wasm-bindgen = "0.6"
web-sys = { version = "0.3", features = [
  "Window", "Document", "Element", "HtmlElement", "HtmlTextAreaElement", "HtmlInputElement",
  "HtmlDivElement", "HtmlIFrameElement", "HtmlAnchorElement", "CssStyleDeclaration",
  "DomRect", "KeyboardEvent", "MouseEvent", "WheelEvent", "ClipboardEvent", "DragEvent", "DataTransfer",
  "DataTransferItem", "DataTransferItemList", "File", "FormData", "Storage", "Location",
  "History", "Node", "NodeList", "Text", "TreeWalker", "NodeFilter", "Range", "Selection",
  "ScrollIntoViewOptions", "ScrollLogicalPosition", "ScrollToOptions", "ScrollBehavior",
  "EventTarget", "Event", "FocusEvent", "InputEvent", "MessageEvent", "AddEventListenerOptions",
  "HtmlCollection", "DomTokenList", "CaretPosition", "EventSource", "FocusOptions", "Blob",
  "BlobPropertyBag", "Clipboard", "ClipboardItem", "Navigator", "SelectionMode", "KeyboardEventInit",
  "HtmlSelectElement", "HtmlButtonElement", "ScrollIntoViewOptions", "CssStyleDeclaration",
] }
