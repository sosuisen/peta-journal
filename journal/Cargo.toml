[workspace]
resolver = "2"
members = [
    "hmtid",
    "journal-api-types",
    "journal-core",
    "journal-names",
    "journal-server",
    "page-names",
    "property-names",
]

[workspace.package]
version = "1.0.0"
edition = "2021"
license = "MIT"

# Less debug info makes the debug build link faster, which every test run and every mutant
# waits for. Our crates keep the line tables, so a panic still names the file and line. The
# dependencies keep none, as we do not step into them.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
