[package]
name = "journal-server"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "PetaJournal journal server"
default-run = "journal-server"

[[bin]]
name = "journal-server"
path = "src/main.rs"

[dependencies]
hmtid = { path = "../hmtid" }
# The pages and items, their markdown folder, and the search (ADR 029)
journal-core = { path = "../journal-core" }

# Web
axum = { version = "0.8", features = ["multipart", "json", "query", "tokio", "http1"] }
tokio = { version = "1", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["cors", "fs", "set-header", "trace"] }
futures = "0.3"
http-body-util = "0.1"
socket2 = "0.6.5"

# MCP
rmcp = { version = "0.9", features = ["server", "macros", "transport-streamable-http-server"] }

# Serialization and time
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }

# Files and OS
notify = "8"
open = "5"
mime_guess = "2"
html-escape = "0.2"
schemars = "1"

# Misc
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
regex = "1"
parking_lot = "0.12"

[dev-dependencies]
property-names = { path = "../property-names" }
reqwest = { version = "0.12", features = ["json", "multipart"] }
# The MCP tests talk to the server as an MCP client does
rmcp = { version = "0.9", features = ["client", "transport-streamable-http-client-reqwest"] }
tempfile = "3"
# A test writes old indexes straight into the database
rusqlite = { version = "0.37", features = ["bundled"] }
