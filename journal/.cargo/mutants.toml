# cargo-mutants, run before a PR on the changed code only; see "Coverage and mutation testing"
# in the README for the command. Every mutant builds the crate again and runs its tests,
# about 10 seconds in all (8 mutants took 77 seconds on 2026-11-04).
#
# The files no test can run are skipped, as the coverage in .cargo/config.toml skips them and
# for the same reason: they hand over to the OS.
exclude_globs = [
    "journal-server/src/main.rs",
    "journal-server/src/application/folder_chooser.rs",
    "journal-server/src/infrastructure/launcher.rs",
    "journal-server/src/infrastructure/pending_delete_prompt.rs",
    # The runtime of a build without the `extensions` feature (2026-11-11). The mutants run
    # with the default features, and that build does not compile this file. Its test runs
    # with `cargo test -p journal-core --no-default-features`.
    "journal-core/src/application/extension_runtime/none.rs",
]

# Every mutant runs the tests of the whole workspace. By default a mutant runs the tests of
# its own crate only. Since ADR 058 the behaviour of journal-core is tested in journal-core,
# but on 2026-11-18 the server tests still reached 77 lines of journal-core in 16 files that
# its own tests did not: the messages of the errors the server answers with, the client id of
# a header, the narrowing of a list by `fields`, and the startup of the server.
test_workspace = true

# Single mutants that no test can catch, skipped by name, as agreed with the user:
# - The quiet time of the folder watcher (2026-11-05). With `+` for `-` the watcher takes a
#   file in at once, and the page ends the same. How often a file was taken in does not show.
# - The search index flush after the folder watcher takes a file in (2026-11-05). Without it
#   the index still commits before the next search and every second, so a search finds the
#   file anyway. The flush only makes the index durable at once, for a crash in that second,
#   and a test cannot open the index from disk while the server holds it.
# - The two functions that start the periodic tasks (2026-11-11). Only main.rs, which is
#   skipped, calls `start_background_tasks`. The tests call `start_index_commits`, but without
#   its commits a search still finds what was written, so its work does not show.
exclude_re = [
    "replace AppState::start_index_commits with \\(\\)",
    "replace AppState::start_background_tasks with \\(\\)",
    "replace - with \\+ in MarkdownFolderWatcher::flush_pending",
    "delete match arm Outcome::Imported \\| Outcome::Conflict in MarkdownFolderWatcher::flush_pending",
]

# A mutant that loops forever runs until the test timeout. By default the timeout is five times
# the test time of the unmutated tree, near 70 seconds here. Twice that time is still far above
# what the tests need, and each such mutant takes 40 seconds less.
timeout_multiplier = 2.0
