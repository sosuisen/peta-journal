# `cargo cov` measures the test coverage of every crate of the workspace with cargo-llvm-cov. The
# tests of the server crate run most of the core crate, so they are measured together. It prints a
# table per file; `cargo cov --html` writes a browsable report to target/llvm-cov/html/.
# Setup, once: `rustup component add llvm-tools-preview` and
# `cargo install cargo-llvm-cov --locked`.
#
# Below 90% of the lines, `cargo cov` fails, and so does the CI. The lines are counted over all
# the measured crates together, not file by file. The report is read for the lines no test
# reaches. They are either removed or given a test of the behaviour that needs them. A test only
# to reach a line is not written.
#
# scripts/verification.test.mjs fails when a crate of the workspace is not measured, or when the
# floor or the files left out change. Such a change needs the consent of the developer.
#
# Why `--no-rustc-wrapper`: by default, cargo-llvm-cov 0.9 builds through a rustc wrapper of its
# own. The wrapper instruments only the crates of the workspace. On Windows, it left journal-core
# and journal-server without instrumentation (2026-11-25). Their tests ran, but no line of them
# was counted. The cause is not known. Without the wrapper, every crate is instrumented, the
# dependencies too, so the first build takes longer.
#
# The atlas crate (../atlas) is outside this workspace. Without the wrapper, its files show up in
# the table too. Its own workspace measures it, so the regex below leaves it out.
#
# These files are left out of the measurement, as agreed on 2026-11-02, because no ordinary
# test can run them: they hand over to the OS.
# - src/main.rs: the entry point, which binds the port and waits for Ctrl-C
# - application/folder_chooser.rs: the native folder dialog (osascript, PowerShell, zenity),
#   and the question at startup that opens it
# - infrastructure/launcher.rs: opens a URL or a folder with the OS
# - infrastructure/pending_delete_prompt.rs: opens the browser through the launcher
# All four are in the server crate. cargo-mutants skips the same files; see .cargo/mutants.toml.
[alias]
cov = [
    "llvm-cov",
    "--no-rustc-wrapper",
    "-p", "hmtid",
    "-p", "journal-core",
    "-p", "journal-server",
    "-p", "property-names",
    "-p", "journal-api-types",
    "-p", "journal-names",
    "-p", "page-names",
    "-p", "page-urls",
    # `[/\\]`: the paths have backslashes on Windows
    "--ignore-filename-regex", "src[/\\\\]main\\.rs$|application[/\\\\]folder_chooser\\.rs$|infrastructure[/\\\\]launcher\\.rs$|infrastructure[/\\\\]pending_delete_prompt\\.rs$|[/\\\\]atlas[/\\\\]",
    "--fail-under-lines", "90",
]

# `cargo run` serves the web frontend from the folder that `npm run build` of the React shell
# writes (ADR 010, ADR 079), so no flag is needed in development. The path is relative to the
# folder of this workspace. A server started without cargo does not see this: it takes
# `--frontend-dir`, or the `frontend/` folder beside its executable.
[env]
PETAJOURNAL_FRONTEND_DIR = { value = "../client/apps/web-app/outliner-react/dist", relative = true }

# rust-lld links much faster than the MSVC link.exe, and it comes with the Rust toolchain.
# Every test run and every mutant waits for the link of the server and its test binaries.
[target.x86_64-pc-windows-msvc]
linker = "rust-lld.exe"
