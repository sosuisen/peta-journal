[package]
name = "journal-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "PetaJournal journal core: the pages and items in SQLite, their markdown folder, and the search, without a server around them (ADR 029)"

[features]
default = ["extensions"]
# Runs the scripts of the extension functions with QuickJS (ADR 009). A build without it has
# the same API and runs no script. rquickjs has no ready bindings for Android (ADR 029).
extensions = ["dep:rquickjs"]

[dependencies]
hmtid = { path = "../hmtid" }
# The names of the journals and the numbers of the weeks, which the frontend core shares
journal-names = { path = "../journal-names" }
page-names = { path = "../page-names" }
# The URLs of the pages, which the frontend core shares; re-exported for the server (ADR 061)
page-urls = { path = "../page-urls" }
# The bodies of the requests, which the frontend core writes with the same types
journal-api-types = { path = "../journal-api-types" }
property-names = { path = "../property-names" }
peta-atlas = { path = "../../atlas" }
# The same version as the crates of flatmarkdown in client/Cargo.toml: a release has all the
# crates of flatmarkdown (ADR 020)
flatmarkdown = "=0.10.0"
flatmarkdown-ast = "=0.10.0"

# Extension functions
rquickjs = { version = "0.14.0", optional = true }

# Data
rusqlite = { version = "0.37", features = ["bundled"] }
tantivy = "0.26"
lindera-tantivy = { version = "5.0", features = ["embed-ipadic"] }
lindera = "5"
lindera-analysis = "5"

# Serialization and time
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }

# Files
sha2 = "0.10"
hex = "0.4"

# Misc
anyhow = "1"
thiserror = "2"
tracing = "0.1"
regex = "1"
parking_lot = "0.12"
unicode-normalization = "0.1.26"
uuid = "1.29.2"

[dev-dependencies]
tempfile = "3"
# Checks that two versions of the definitions put together give the same result on every
# device, whatever comes first (ADR 046)
proptest = "1.12.0"
