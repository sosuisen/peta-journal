[package]
name = "journal-api-types"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The bodies of the requests to the journal, as the journal reads them and its clients write them"

# `schemars` gives the bodies a JSON schema, for the MCP tools of the journal server that take
# them as their arguments (ADR 060). The frontend core builds without it.
[features]
schemars = ["dep:schemars"]

[dependencies]
serde = { version = "1", features = ["derive"] }
schemars = { version = "1", optional = true }

[dev-dependencies]
serde_json = "1"
