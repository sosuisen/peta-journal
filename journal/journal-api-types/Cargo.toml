[package]
name = "journal-api-types"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The bodies of the requests to the journal, as the journal reads them and its clients write them"

# `schemars` gives the bodies a JSON schema, for the MCP tools of the journal server that take
# them as their arguments (ADR 060). The frontend core builds without it.
# `facet` lets the native shells have the types that cross their border, as `ItemPosition`
# (ADR 024, ADR 081). The frontend core turns it on to make those types; the server does not.
[features]
schemars = ["dep:schemars"]
facet = ["dep:facet"]

[dependencies]
serde = { version = "1", features = ["derive"] }
schemars = { version = "1", optional = true }
# The same version as client-core, which makes the types of the native shells
facet = { version = "=0.46.5", optional = true }

[dev-dependencies]
serde_json = "1"
