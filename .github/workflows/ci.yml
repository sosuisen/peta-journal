name: CI

# The CI runs only when asked, from the Actions tab or with `gh workflow run CI --ref <branch>`.
# The checks of each job are in scripts/checks.mjs. The hook before a pull request
# (.claude/hooks/verify-before-pr.mjs) runs the same checks on a developer's machine.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust:
    name: ${{ matrix.workspace }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        workspace: [journal, client, atlas]
    steps:
      - uses: actions/checkout@v7
      # Installs the version, components and targets in rust-toolchain.toml
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ${{ matrix.workspace }}
      - run: rustup component add llvm-tools-preview
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov@0.9.2
      # The Emacs mode of client/apps/emacs/outliner is checked in the client job.
      # The Emacs is the snap, not the apt package. The apt Emacs of Ubuntu is 30. The indent of
      # Emacs 30 differs from Emacs 31, which the developer uses, so the format check fails there.
      # Why not purcell/setup-emacs: its Emacs has no X and no images, and some of the tests are
      # about them. The snap moves to a new major version by itself, so the step checks it.
      - if: matrix.workspace == 'client'
        run: |
          sudo snap install emacs --classic
          emacs --batch --eval '(unless (= emacs-major-version 31) (error "Emacs %s is not 31" emacs-version))'
      # The formatter of the Emacs Lisp is shared with other projects. A new tag of it changes
      # nothing here until this line asks for it
      - if: matrix.workspace == 'client'
        uses: actions/checkout@v7
        with:
          repository: sosuisen/elisp-formatter
          ref: v0.1.0
          path: elisp-formatter
      - run: node scripts/checks.mjs run ${{ matrix.workspace }}
        env:
          PETA_EMACS: emacs
          ELISP_FORMATTER: ${{ github.workspace }}/elisp-formatter/elisp-formatter.el

  # The E2E tests of the Emacs mode press real keys, with the real shell and a real server
  emacs-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      # Installs the version, components and targets in rust-toolchain.toml
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            journal
            client
      # The same Emacs as the client job. See there why it is the snap
      - run: |
          sudo snap install emacs --classic
          emacs --batch --eval '(unless (= emacs-major-version 31) (error "Emacs %s is not 31" emacs-version))'
      - run: node scripts/checks.mjs run emacs-e2e
        env:
          PETA_EMACS: emacs

  todo:
    name: client/apps/web-app/todo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: client/apps/web-app/todo/package-lock.json
      - run: node scripts/checks.mjs run todo

  # The web shell in React. Its core is the wasm of client-web-bridge. The tests, the lint and the
  # types need that wasm and the types of the border, which `npm run border` makes from the Rust
  # code. The e2e tests with Playwright run on a developer's machine only.
  outliner-react:
    name: client/apps/web-app/outliner-react
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Installs the version, components and targets in rust-toolchain.toml
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: client
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack@0.15.1
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: client/apps/web-app/outliner-react/package-lock.json
      - run: node scripts/checks.mjs run outliner-react

  memoview-win:
    name: client/apps/webview-app/memoview-win
    # The app is WinUI. It builds only on Windows, with the MSBuild of Visual Studio
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: microsoft/setup-msbuild@v3
      - run: node scripts/checks.mjs run memoview-win
