name: CI

on:
  push:
    branches: [main]
    paths-ignore: ["docs/**", "**.md"]
  pull_request:
    paths-ignore: ["docs/**", "**.md"]

permissions:
  contents: read

jobs:
  rust:
    name: ${{ matrix.workspace }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - workspace: journal
            args: --workspace
          - workspace: client
            args: --workspace
          - workspace: atlas
            args: --all-features
    defaults:
      run:
        working-directory: ${{ matrix.workspace }}
    steps:
      - uses: actions/checkout@v7
      # Installs the version, components and targets in rust-toolchain.toml
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ${{ matrix.workspace }}
      - run: cargo fmt --check
      - run: cargo clippy --all-targets ${{ matrix.args }}
      - run: cargo test ${{ matrix.args }}
      # The apps on a phone build the core without the extensions, a path the server never
      # takes (ADR 058)
      - if: matrix.workspace == 'journal'
        run: cargo test -p journal-core --no-default-features
      # What only a native shell needs is behind features: the generation of its types, and the
      # entrance for another language
      - if: matrix.workspace == 'client'
        run: cargo clippy -p client-native-bridge -p client-shell-http --features client-native-bridge/facet_typegen,client-shell-http/ffi --all-targets
      - if: matrix.workspace == 'client'
        run: cargo test -p client-native-bridge -p client-shell-http --features client-native-bridge/facet_typegen,client-shell-http/ffi --test codegen --test ffi
      # The browser side of client-web-bridge (src/web.rs) is built for wasm only
      - if: matrix.workspace == 'client'
        run: cargo clippy --target wasm32-unknown-unknown -p client-web-bridge --lib
      # The Emacs mode of client/apps/emacs/outliner. These tests need no process. The E2E tests are
      # in the emacs-e2e job: they need the journal server too.
      # Why not emacs-nox: it has no images and no fringes, and some of the tests are about them
      - if: matrix.workspace == 'client'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends emacs-gtk
      - if: matrix.workspace == 'client'
        working-directory: client/apps/emacs/outliner
        run: emacs -Q --batch -L lisp -l lisp/test/peta-journal-test.el -f ert-run-tests-batch-and-exit

  # The E2E tests of the Emacs mode press real keys, with the real shell and a real server
  emacs-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PETA_E2E_SERVER: ${{ github.workspace }}/journal/target/debug/journal-server
    steps:
      - uses: actions/checkout@v7
      # Installs the version, components and targets in rust-toolchain.toml
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            journal
            client
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends emacs-gtk
      - working-directory: journal
        run: cargo build -p journal-server
      - working-directory: client
        run: cargo build -p outliner-emacs
      # The tests skip themselves when a program is missing, and the job would pass with no test run
      - run: test -x "$PETA_E2E_SERVER" && test -x client/target/debug/outliner-emacs
      - working-directory: client/apps/emacs/outliner
        run: emacs -Q --batch -L lisp -L lisp/test -l lisp/test/peta-journal-e2e.el -f ert-run-tests-batch-and-exit

  todo:
    name: client/apps/web-app/todo
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client/apps/web-app/todo
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: client/apps/web-app/todo/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm test
      - run: npm run build

  memoview-win:
    name: client/apps/webview-app/memoview-win
    # The app is WinUI. It builds only on Windows, with the MSBuild of Visual Studio
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      # CSharpier is a local tool of memoview-win (dotnet-tools.json)
      - run: dotnet tool restore
        working-directory: client/apps/webview-app/memoview-win
      - run: dotnet csharpier check .
        working-directory: client/apps/webview-app/memoview-win
      # Why in this folder: its global.json selects the test runner, and the SDK finds it only
      # from the current folder upward.
      # The analyzers run in both builds below. Their settings are in Directory.Build.props
      - run: dotnet test
        working-directory: client/apps/webview-app/memoview-win/memoview-tests
      # The tests compile only the files without WinUI. The build shows what breaks in the rest
      - uses: microsoft/setup-msbuild@v3
      - run: msbuild client/apps/webview-app/memoview-win/memoview/MemoView.csproj -restore -p:Platform=x64 -nologo -v:m
