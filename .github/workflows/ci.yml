name: CI

on:
  push:
    branches: [main]
    paths-ignore: ["docs/**", "**.md"]
  pull_request:
    paths-ignore: ["docs/**", "**.md"]

permissions:
  contents: read

jobs:
  rust:
    name: ${{ matrix.workspace }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - workspace: journal-server-rust
            args: --workspace
          - workspace: frontend-rust
            args: --workspace
          - workspace: atlas-rust
            args: --all-features
    defaults:
      run:
        working-directory: ${{ matrix.workspace }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ${{ matrix.workspace }}
      - run: cargo fmt --check
      - run: cargo clippy --all-targets ${{ matrix.args }}
      - run: cargo test ${{ matrix.args }}
      # The shell only runs in the browser, and the native build above does not show what breaks on wasm
      - if: matrix.workspace == 'frontend-rust'
        run: cargo check --target wasm32-unknown-unknown -p peta-frontend
      # The Emacs mode of crates/shell-emacs. These tests need no process. The E2E tests are not
      # run here: they need the journal server too.
      # Why not emacs-nox: it has no images and no fringes, and some of the tests are about them
      - if: matrix.workspace == 'frontend-rust'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends emacs-gtk
      - if: matrix.workspace == 'frontend-rust'
        working-directory: frontend-rust/crates/shell-emacs
        run: emacs -Q --batch -L lisp -l lisp/test/peta-journal-test.el -f ert-run-tests-batch-and-exit

  todo:
    name: ext-web-app/todo
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ext-web-app/todo
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ext-web-app/todo/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm test
      - run: npm run build

  stickies:
    name: ext-desktop-app/stickies
    # The app is WinUI. It builds only on Windows, with the MSBuild of Visual Studio
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      # Why in this folder: its global.json selects the test runner, and the SDK finds it only
      # from the current folder upward
      - run: dotnet test
        working-directory: ext-desktop-app/stickies-tests
      # The tests compile only the files without WinUI. The build shows what breaks in the rest
      - uses: microsoft/setup-msbuild@v3
      - run: msbuild ext-desktop-app/stickies/Stickies.csproj -restore -p:Platform=x64 -nologo -v:m
