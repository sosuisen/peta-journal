name: CI

# The CI runs on each pull request, on each push to it, and on each push to main. It can also be
# started by hand, from the Actions tab or with `gh workflow run CI --ref <branch>`. The checks of
# each job are in scripts/checks.mjs. The hook before a pull request
# (.claude/hooks/verify-before-pr.mjs) runs the same checks on a developer's machine.
#
# The jobs of every OS run. The repository is public, and its standard runners cost nothing, also
# on macOS. A larger runner would cost: none of the jobs uses one.
#
# The plan job picks the jobs that the changed files touch, with the same rule as the hook
# (`node scripts/checks.mjs jobs`). The other jobs are skipped. A change only under docs/ touches
# no job but the guard. By hand, every job is picked.
#
# The ci job waits for all the others, and fails if one of them failed or was cancelled. A skipped
# job counts as passed. The protection of main asks for this one check only: a job that is
# skipped, or added later, needs no change of the protection.
#
# By hand, each OS can be left out, to wait less. The jobs of an OS left out show as skipped. The
# guard job runs every time. For only the Windows jobs:
# `gh workflow run CI --ref <branch> -f linux=false -f macos=false`
#
# ios_only runs the guard and the outliner-ios job, and no other job, whatever the inputs of the
# OS say: `gh workflow run CI --ref <branch> -f ios_only=true`
on:
  workflow_dispatch:
    inputs:
      linux:
        description: Run the jobs on Linux
        type: boolean
        default: true
      windows:
        description: Run the jobs on Windows
        type: boolean
        default: true
      macos:
        description: Run the jobs on macOS
        type: boolean
        default: true
      ios_only:
        description: Run only the outliner-ios job on macOS, and the guard
        type: boolean
        default: false
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A new push to a pull request stops the run of the commit before it. A run on main is not
# stopped: the caches that every branch reads are saved there
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The jobs that the changed files touch, as a JSON list. `rust` holds those of the matrix
  plan:
    runs-on: ubuntu-latest
    outputs:
      jobs: ${{ steps.plan.outputs.jobs }}
      rust: ${{ steps.plan.outputs.rust }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      # Without a base to compare with (by hand, or the first push of main), every file counts
      - id: plan
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          RUST: '["journal","client","atlas"]'
        run: |
          if [ "$EVENT" != workflow_dispatch ] && git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            git diff --name-only "$BASE"...HEAD > "$RUNNER_TEMP/files"
          else
            git ls-files > "$RUNNER_TEMP/files"
          fi
          # xargs may start node more than once for many files; unique joins the lists
          jobs=$(tr '\n' '\0' < "$RUNNER_TEMP/files" | xargs -0 node scripts/checks.mjs jobs | jq -Rnc '[inputs | select(. != "")] | unique')
          echo "jobs=$jobs" >> "$GITHUB_OUTPUT"
          echo "rust=$(jq -c --argjson rust "$RUST" '[.[] | select(IN($rust[]))]' <<< "$jobs")" >> "$GITHUB_OUTPUT"
          echo "$jobs"

  # The settings of the checks: the coverage floors, the files left out, the jobs and the hook
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: node scripts/checks.mjs run guard

  rust:
    name: ${{ matrix.workspace }}
    needs: plan
    if: needs.plan.outputs.rust != '[]' && (github.event_name != 'workflow_dispatch' || inputs.linux) && !inputs.ios_only
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        workspace: ${{ fromJSON(needs.plan.outputs.rust) }}
    steps:
      - uses: actions/checkout@v7
      # Installs the version, components and targets in rust-toolchain.toml
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ${{ matrix.workspace }}
      - run: rustup component add llvm-tools-preview
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov@0.9.2
      # The Emacs mode of client/apps/emacs/outliner is checked in the client job.
      # The Emacs is the snap, not the apt package. The apt Emacs of Ubuntu is 30. The indent of
      # Emacs 30 differs from Emacs 31, which the developer uses, so the format check fails there.
      # Why not purcell/setup-emacs: its Emacs has no X and no images, and some of the tests are
      # about them. The snap moves to a new major version by itself, so the step checks it.
      - if: matrix.workspace == 'client'
        run: |
          sudo snap install emacs --classic
          emacs --batch --eval '(unless (= emacs-major-version 31) (error "Emacs %s is not 31" emacs-version))'
      # The formatter of the Emacs Lisp is shared with other projects. A new tag of it changes
      # nothing here until this line asks for it
      - if: matrix.workspace == 'client'
        uses: actions/checkout@v7
        with:
          repository: sosuisen/elisp-formatter
          ref: v0.1.0
          path: elisp-formatter
      - run: node scripts/checks.mjs run ${{ matrix.workspace }}
        env:
          PETA_EMACS: emacs
          ELISP_FORMATTER: ${{ github.workspace }}/elisp-formatter/elisp-formatter.el

  # The E2E tests of the Emacs mode press real keys, with the real shell and a real server
  emacs-e2e:
    needs: plan
    if: contains(fromJSON(needs.plan.outputs.jobs), 'emacs-e2e') && (github.event_name != 'workflow_dispatch' || inputs.linux) && !inputs.ios_only
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      # Installs the version, components and targets in rust-toolchain.toml
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            journal
            client
      # The same Emacs as the client job. See there why it is the snap
      - run: |
          sudo snap install emacs --classic
          emacs --batch --eval '(unless (= emacs-major-version 31) (error "Emacs %s is not 31" emacs-version))'
      - run: node scripts/checks.mjs run emacs-e2e
        env:
          PETA_EMACS: emacs

  todo:
    name: client/apps/web-app/todo
    needs: plan
    if: contains(fromJSON(needs.plan.outputs.jobs), 'todo') && (github.event_name != 'workflow_dispatch' || inputs.linux) && !inputs.ios_only
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: client/apps/web-app/todo/package-lock.json
      - run: node scripts/checks.mjs run todo

  # The web shell in React. Its core is the wasm of client-web-bridge. The tests, the lint and the
  # types need that wasm and the types of the border, which `npm run border` makes from the Rust
  # code. The e2e tests with Playwright run on a developer's machine only.
  outliner-react:
    name: client/apps/web-app/outliner-react
    needs: plan
    if: contains(fromJSON(needs.plan.outputs.jobs), 'outliner-react') && (github.event_name != 'workflow_dispatch' || inputs.linux) && !inputs.ios_only
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Installs the version, components and targets in rust-toolchain.toml
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: client
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack@0.15.1
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: client/apps/web-app/outliner-react/package-lock.json
      - run: node scripts/checks.mjs run outliner-react

  # The sticky notes on Windows. The tests of PetaBorder need the core as a library, made from the
  # Rust code with BoltFFI, and a journal server. The tests of the windows run here too: they press
  # real keys on the screen of the runner.
  stickies-win:
    name: client/apps/native-app/stickies-win
    needs: plan
    if: contains(fromJSON(needs.plan.outputs.jobs), 'stickies-win') && (github.event_name != 'workflow_dispatch' || inputs.windows) && !inputs.ios_only
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      # Installs the version, components and targets in rust-toolchain.toml
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            journal
            client
      # The version has to be the same as the boltffi dependency of client-shell-http.
      # Building it takes about 20 minutes, so the program is kept in the cache. The key holds
      # the version: a new version builds once, then comes from the cache
      - id: boltffi
        uses: actions/cache@v6
        with:
          path: ~/.cargo/bin/boltffi.exe
          key: boltffi-cli-0.32.1-${{ runner.os }}
      - if: steps.boltffi.outputs.cache-hit != 'true'
        run: cargo install boltffi_cli --version =0.32.1 --locked
      # The projects target .NET 11
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 11.0.x
      - run: node scripts/checks.mjs run stickies-win

  # The sticky notes on macOS. The tests need the core as a library, made from the Rust code with
  # BoltFFI, and a journal server. Swift and swift-format come with the Xcode of the runner.
  stickies-mac:
    name: client/apps/native-app/stickies-mac
    needs: plan
    if: contains(fromJSON(needs.plan.outputs.jobs), 'stickies-mac') && (github.event_name != 'workflow_dispatch' || inputs.macos) && !inputs.ios_only
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      # Installs the version, components and targets in rust-toolchain.toml
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            journal
            client
      # The same version as the stickies-win job, kept in the cache for the same reason
      - id: boltffi
        uses: actions/cache@v6
        with:
          path: ~/.cargo/bin/boltffi
          key: boltffi-cli-0.32.1-${{ runner.os }}
      - if: steps.boltffi.outputs.cache-hit != 'true'
        run: cargo install boltffi_cli --version =0.32.1 --locked
      - run: node scripts/checks.mjs run stickies-mac

  outliner-ios:
    name: client/apps/native-app/outliner-ios
    needs: plan
    if: contains(fromJSON(needs.plan.outputs.jobs), 'outliner-ios') && (github.event_name != 'workflow_dispatch' || inputs.macos || inputs.ios_only)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      # Installs the version, components and targets in rust-toolchain.toml
      - run: rustup toolchain install
      # The targets of the phone and the simulator are not in rust-toolchain.toml: every machine
      # would download them
      - run: rustup target add aarch64-apple-ios aarch64-apple-ios-sim
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: client
      # The same version as the stickies-mac job, kept in the cache for the same reason
      - id: boltffi
        uses: actions/cache@v6
        with:
          path: ~/.cargo/bin/boltffi
          key: boltffi-cli-0.32.1-${{ runner.os }}
      - if: steps.boltffi.outputs.cache-hit != 'true'
        run: cargo install boltffi_cli --version =0.32.1 --locked
      # Makes the Xcode project from project.yml
      - run: brew install xcodegen
      - run: node scripts/checks.mjs run outliner-ios
      # The whole log of the tests, with the time of each, goes with the runner otherwise. The
      # tests of the screens fail now and then on the runner, and the time tells why (#1174)
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: outliner-ios-coverage-log
          path: client/apps/native-app/outliner-ios/build/coverage.log
          if-no-files-found: ignore
          retention-days: 14

  memoview-win:
    name: client/apps/webview-app/memoview-win
    # The app is WinUI. It builds only on Windows, with the MSBuild of Visual Studio
    needs: plan
    if: contains(fromJSON(needs.plan.outputs.jobs), 'memoview-win') && (github.event_name != 'workflow_dispatch' || inputs.windows) && !inputs.ios_only
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: microsoft/setup-msbuild@v3
      - run: node scripts/checks.mjs run memoview-win

  # The one check that the protection of main asks for
  ci:
    if: always()
    needs: [plan, guard, rust, emacs-e2e, todo, outliner-react, stickies-win, stickies-mac, outliner-ios, memoview-win]
    runs-on: ubuntu-latest
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
