# cargo-mutants, run before a PR on the changed code only; see "Coverage and mutation testing"
# in the README for the command. Every mutant builds the crate again and runs its tests,
# about 10 seconds in all (8 mutants took 77 seconds on 2026-11-04).
#
# The files no test can run are skipped, as the coverage in .cargo/config.toml skips them and
# for the same reason: they hand over to the OS.
exclude_globs = [
    "crates/server/src/main.rs",
    "crates/server/src/application/folder_chooser.rs",
    "crates/server/src/infrastructure/launcher.rs",
    "crates/server/src/infrastructure/export/pending_delete_prompt.rs",
]

# A mutant that loops forever runs until the test timeout. By default the timeout is five times
# the test time of the unmutated tree, near 70 seconds here. Twice that time is still far above
# what the tests need, and each such mutant takes 40 seconds less.
timeout_multiplier = 2.0
