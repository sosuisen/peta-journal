[package]
name = "journal-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "PetaJournal journal core: the pages and items in SQLite, their markdown folder, and the search, without a server around them (ADR 029)"

[dependencies]
hmtid = { path = "../hmtid" }
peta-atlas = { path = "../../../atlas-rust" }
flatmarkdown = "=0.7.0"

# Extension functions
rquickjs = "0.14.0"

# Data
rusqlite = { version = "0.37", features = ["bundled"] }
tantivy = "0.26"
lindera-tantivy = { version = "5.0", features = ["embed-ipadic"] }
lindera = "5"
lindera-analysis = "5"

# Serialization and time
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"

# Files
sha2 = "0.10"
hex = "0.4"

# Misc
anyhow = "1"
thiserror = "2"
tracing = "0.1"
regex = "1"
parking_lot = "0.12"
unicode-normalization = "0.1.26"

[dev-dependencies]
tempfile = "3"
