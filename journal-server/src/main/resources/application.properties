# PetaJournal Server Configuration
# Data paths
petajournal.data.dir=${user.home}/.peta-journal/data
petajournal.data.db=${petajournal.data.dir}/journal.db
petajournal.index.dir=${user.home}/.peta-journal/index
petajournal.export.dir=${user.home}/.peta-journal/pages
petajournal.config.dir=${user.home}/.peta-journal
petajournal.lib.dir=lib
# CORS (for Angular dev server)
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=http://localhost:4200,http://localhost:5180
quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS
quarkus.http.cors.headers=Content-Type,Authorization
quarkus.http.cors.exposed-headers=Content-Disposition
# HTTP port
quarkus.http.port=8087
# Export scheduler interval (seconds)
petajournal.export.interval=5
# Folder -> DB import (changes made to the markdown files are merged back into the DB)
petajournal.import.enabled=true
# Wait this long after the last file event before reading the file (ms)
petajournal.import.debounce-ms=2000
# Full folder scan interval (seconds); first scan runs 10s after startup
petajournal.import.scan-interval=60
# Don't reopen the "files disappeared" browser page more often than this (seconds)
petajournal.import.delete-prompt-cooldown=300
# Logging
quarkus.log.level=INFO
quarkus.log.category."com.petajournal".level=INFO
quarkus.log.category."com.petajournal.server.infrastructure.persistence".level=INFO
